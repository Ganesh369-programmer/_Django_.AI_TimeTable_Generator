<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ClassIQ - AI Timetable Generator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5.3 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom CSS (you can move this to /static/css/style.css later) -->
    <style>
        :root {
            --cyan: #22d3ee;
            --purple: #c026d3;
            --dark: #0f172a;
            --card: #1e2937;
        }
        
        body {
            background: linear-gradient(135deg, #0a0f1c 0%, #1e2937 100%);
            color: #e2e8f0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            min-height: 100vh;
        }
        
        .navbar {
            background: rgba(15, 23, 42, 0.97) !important;
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--cyan);
        }
        
        .navbar-brand {
            font-weight: 700;
            letter-spacing: -1px;
        }
        
        .hero-bg {
            background: linear-gradient(90deg, rgba(34,211,238,0.1), rgba(192,38,211,0.1));
        }
        
        .card-main {
            background: var(--card);
            border: 2px solid var(--cyan);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(34,211,238,0.15);
            overflow: hidden;
        }
        
        .section-card {
            background: rgba(15,23,42,0.6);
            border: 1px solid rgba(34,211,238,0.3);
            border-radius: 16px;
            transition: all 0.3s ease;
        }
        
        .section-card:hover {
            border-color: var(--cyan);
            box-shadow: 0 0 25px rgba(34,211,238,0.3);
            transform: translateY(-4px);
        }
        
        .form-control, .form-select {
            background: #0f172a;
            border: 1px solid #334155;
            color: #e2e8f0;
            border-radius: 12px;
            padding: 12px 16px;
            transition: all 0.3s;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 4px rgba(34,211,238,0.2);
            background: #1e2937;
        }
        
        .form-label {
            color: #94a3b8;
            font-weight: 500;
        }
        
        .btn-neon {
            background: linear-gradient(90deg, #22d3ee, #c026d3);
            border: none;
            color: #0f172a;
            font-weight: 700;
            border-radius: 50px;
            padding: 14px 32px;
            box-shadow: 0 10px 20px rgba(34,211,238,0.4);
            transition: all 0.3s;
        }
        
        .btn-neon:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(192,38,211,0.5);
        }
        
        .slider-container {
            overflow: hidden;
            border-radius: 16px;
        }
        
        .slider {
            display: flex;
            transition: transform 0.6s cubic-bezier(0.32, 0.72, 0, 1);
        }
        
        .form-slide {
            min-width: 100%;
            padding: 30px;
        }
        
        .nav-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 20px 0;
        }
        
        .dot {
            width: 12px;
            height: 12px;
            background: #475569;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .dot.active {
            background: var(--cyan);
            transform: scale(1.4);
            box-shadow: 0 0 12px var(--cyan);
        }
        
        .file-upload {
            border: 2px dashed #64748b;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .file-upload:hover {
            border-color: var(--cyan);
            background: rgba(34,211,238,0.05);
        }
        
        .neon-text {
            text-shadow: 0 0 15px var(--cyan);
        }
        
        .footer {
            background: #0a0f1c;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

<!-- 🔥 Updated Navbar -->
<nav class="navbar navbar-dark navbar-expand-lg sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold text-white fs-3" href="/">
            ClassIQ <span class="text-cyan neon-text">🤖 2.0</span>
        </a>
        <div class="d-flex gap-3">
            <a href="/" class="btn btn-outline-light rounded-pill px-4">
                <i class="bi bi-house-door"></i> Home
            </a>
            <a href="{% url "result" %}" class="btn btn-neon px-4">
                <i class="bi bi-lightning-charge"></i> Generate Timetable
            </a>
        </div>
    </div>
</nav>

<!-- Page Content -->
<div class="container mt-5">
    {% block content %}{% endblock %}
</div>

<!-- Footer -->
<footer class="footer text-center text-light py-4 mt-5">
    <div class="container">
        © 2026 ClassIQ - AI Timetable Generator | Made with ❤️ by You
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
