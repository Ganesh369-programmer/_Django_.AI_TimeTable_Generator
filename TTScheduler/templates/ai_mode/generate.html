{% extends 'base1.html' %}
{% block content %}

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-11">
            
            <!-- Hero Header -->
            <div class="text-center mb-5 hero-bg py-5 rounded-4">
                <h1 class="display-4 fw-bold neon-text">Create Department Timetables</h1>
                <p class="lead text-light opacity-75">Powerful AI-powered scheduling for multiple departments in seconds</p>
            </div>

            <div class="card-main p-4 p-md-5">

                <!-- Department Count -->
                <div class="row g-3 align-items-end mb-5">
                    <div class="col-md-8">
                        <label class="form-label fs-5">How many departments do you want to generate?</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-transparent border-0"><i class="bi bi-building text-cyan fs-3"></i></span>
                            <input type="number" id="deptCount" class="form-control form-control-lg" placeholder="e.g. 3" min="1" value="1">
                        </div>
                    </div>
                    <div class="col-md-4">
                        <button onclick="createForms()" class="btn btn-neon w-100 py-3">
                            <i class="bi bi-plus-circle"></i> Create Department Forms
                        </button>
                    </div>
                </div>

                <!-- Form -->
                <form method="POST" action="/ai_mode/timetable/" enctype="multipart/form-data" id="mainForm">
                    {% csrf_token %}

                    <!-- Slider -->
                    <div class="slider-container mb-4">
                        <div class="slider" id="slider"></div>
                    </div>

                    <!-- Navigation -->
                    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
                        <button type="button" class="btn btn-outline-light px-4" onclick="prevSlide()">
                            <i class="bi bi-arrow-left"></i> Previous
                        </button>
                        
                        <div class="nav-dots" id="dots"></div>
                        
                        <button type="button" class="btn btn-outline-light px-4" onclick="nextSlide()">
                            Next <i class="bi bi-arrow-right"></i>
                        </button>
                    </div>

                    <!-- Submit -->
                    <button type="submit" class="btn btn-neon w-100 mt-5 py-4 fs-5">
                        <i class="bi bi-rocket-takeoff"></i> 🚀 Generate All Timetables
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<style>
    /* Additional slide styling */
    .form-slide {
        background: rgba(15,23,42,0.6);
        border-radius: 20px;
    }
</style>

<script>
let currentSlide = 0;

function createForms() {
    let count = parseInt(document.getElementById("deptCount").value) || 1;
    let slider = document.getElementById("slider");
    let dotsContainer = document.getElementById("dots");
    
    slider.innerHTML = "";
    dotsContainer.innerHTML = "";
    currentSlide = 0;

    for (let i = 1; i <= count; i++) {
        let html = `
        <div class="form-slide">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="bg-cyan text-dark rounded-circle d-flex align-items-center justify-content-center" style="width:48px;height:48px;font-weight:700;font-size:1.4rem;">
                    ${i}
                </div>
                <h2 class="mb-0 text-white">Department ${i}</h2>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Department Name</label>
                    <input name="dept_name[]" class="form-control" placeholder="Computer Engineering">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Semester</label>
                    <input name="semester[]" class="form-control" placeholder="SE / TE / BE">
                </div>
            </div>

            {% include "ai_mode/form_template.html" %}
        </div>`;
        
        slider.innerHTML += html;

        // Dots
        let dot = document.createElement("div");
        dot.className = "dot";
        dot.onclick = () => { currentSlide = i-1; updateSlider(); };
        dotsContainer.appendChild(dot);
    }
    
    updateSlider();
}

function updateSlider() {
    document.getElementById("slider").style.transform = `translateX(-${currentSlide * 100}%)`;
    
    // Update active dot
    document.querySelectorAll('.dot').forEach((dot, idx) => {
        dot.classList.toggle('active', idx === currentSlide);
    });
}

function nextSlide() {
    let total = document.querySelectorAll(".form-slide").length;
    if (currentSlide < total - 1) {
        currentSlide++;
        updateSlider();
    }
}

function prevSlide() {
    if (currentSlide > 0) {
        currentSlide--;
        updateSlider();
    }
}

// Keep your original Excel → JSON script (unchanged)
document.addEventListener("change", function(e) {
    if (e.target.classList.contains("subjectFile")) {
        let file = e.target.files[0];
        let textarea = e.target.parentElement.querySelector(".subjectJson");
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(evt) {
            let data = new Uint8Array(evt.target.result);
            let workbook = XLSX.read(data, {type: "array"});
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            let json = XLSX.utils.sheet_to_json(sheet);
            textarea.value = JSON.stringify(json, null, 2);
        };
        reader.readAsArrayBuffer(file);
    }
    
    if (e.target.classList.contains("teacherFile")) {
        let file = e.target.files[0];
        let textarea = e.target.parentElement.querySelector(".teacherJson");
        if (!file) return;
        let reader = new FileReader();
        reader.onload = function(evt) {
            let data = new Uint8Array(evt.target.result);
            let workbook = XLSX.read(data, {type: "array"});
            let sheet = workbook.Sheets[workbook.SheetNames[0]];
            let json = XLSX.utils.sheet_to_json(sheet);
            textarea.value = JSON.stringify(json, null, 2);
        };
        reader.readAsArrayBuffer(file);
    }
});
</script>

<!-- Excel Library -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

{% endblock %}
